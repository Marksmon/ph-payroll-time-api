services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ph_payroll_time_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/PhPayrollTimeApi.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ph_payroll_time_db;Username=postgres;Password=postgres
      - Jwt__PublicKeyPath=/app/keys/jwt-public.pem
      - Jwt__PrivateKeyPath=/app/keys/jwt-private.pem
    volumes:
      - api_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_keys:
